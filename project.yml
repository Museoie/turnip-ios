name: Turnip

options:
  bundleIdPrefix: com.hoiekim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    # Strict-concurrency checking for code that has already adopted concurrency
    # (Sendable, @MainActor, actors) — see issue #75. Under Swift 5 language
    # mode these arrive as warnings, so this is diagnostic-only until the
    # warnings-as-errors question is settled. Follow-up: raise to `complete`.
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  Turnip:
    type: application
    platform: iOS
    sources:
      - path: Turnip
        excludes:
          - Models/*.tflite
      - path: Turnip/Models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoiekim.turnip
        PRODUCT_NAME: Turnip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Turnip/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies: []

  TurnipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TurnipTests
    dependencies:
      - target: Turnip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoiekim.turnip.tests
        GENERATE_INFOPLIST_FILE: YES

  TurnipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TurnipUITests
    dependencies:
      - target: Turnip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoiekim.turnip.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Turnip:
    build:
      targets:
        Turnip: all
        TurnipTests: [test]
    test:
      targets:
        - TurnipTests
        - TurnipUITests
    run:
      config: Debug
