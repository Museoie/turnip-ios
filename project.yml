name: Turnip

options:
  bundleIdPrefix: com.hoiekim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    # Strict-concurrency checking for code that has already adopted concurrency
    # (Sendable, @MainActor, actors) — see issue #75. Under Swift 5 language
    # mode these arrive as warnings, so this is diagnostic-only until the
    # warnings-as-errors question is settled. Follow-up: raise to `complete`.
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # The App Store version, CFBundleShortVersionString. App Store Connect only
    # takes builds of a version above the last one approved, so this moves past
    # each release before the next archive can upload. Xcode Cloud sets the
    # build number (CFBundleVersion) itself.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 1

targets:
  Turnip:
    type: application
    platform: iOS
    sources:
      - path: Turnip
        excludes:
          - Models/*.tflite
      - path: Turnip/Models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoiekim.turnip
        PRODUCT_NAME: Turnip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Turnip/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Sign in with Apple, the farm account contribution signs in with
        # (docs/CONTRIBUTION_DESIGN.md §5.4).
        CODE_SIGN_ENTITLEMENTS: Turnip/Resources/Turnip.entitlements
    dependencies: []

  TurnipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TurnipTests
        # The script that made the trick-model fixtures beside it, kept with them but not bundled.
        excludes:
          - Fixtures/*.py
    dependencies:
      - target: Turnip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoiekim.turnip.tests
        GENERATE_INFOPLIST_FILE: YES

  TurnipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TurnipUITests
      # Shared with the app target, so an identifier the harness draws and a test looks up
      # can't drift apart.
      - path: Turnip/App/HarnessIdentifiers.swift
    dependencies:
      - target: Turnip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoiekim.turnip.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Turnip:
    build:
      targets:
        Turnip: all
        TurnipTests: [test]
    test:
      targets:
        - TurnipTests
        - TurnipUITests
    run:
      config: Debug
