name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR pushes — cancelling a push-to-main run can
  # leave a merged commit with a cancelled rather than green check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect UI-relevant changes so the screenshots job only runs when needed.
  # macOS runners bill at 10x Linux minutes, so this stays off PRs that only
  # touch non-UI code. Runs on ubuntu (cheap) and finishes in seconds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          filters: |
            ui:
              - 'Turnip/**'
              - 'TurnipUITests/**'
              - 'project.yml'
              - '.github/workflows/ci.yml'

  build-and-test:
    needs: changes
    runs-on: macos-26
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Bundler gems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      # Matches the Xcode version CONTRIBUTING.md documents as the dev
      # baseline. XcodeGen's emitted project format tracks its own release,
      # not the selected Xcode, so this must stay new enough to open it —
      # see https://github.com/yonaskolb/XcodeGen/issues/1578. 26.3 is the
      # only version exercised here; README.md and CONTRIBUTING.md name it as
      # the verified one and mark the older minimum as untested.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # Homebrew only bottles the latest formula version, and its default
      # `pod` (via `brew install cocoapods`) drifts independently of
      # Xcode Cloud's ci_post_clone.sh, so both pipelines call the same
      # pinned installer instead. A user-writable prefix (no sudo) keeps
      # this identical to ci_post_clone.sh — Xcode Cloud's build
      # environment has no passwordless sudo.
      - name: Install XcodeGen
        run: |
          ci_scripts/install-xcodegen.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # SwiftLint is pinned the way XcodeGen is: a versioned release archive
      # into $HOME/.local with no sudo, verified by SHA-256 (see
      # ci_scripts/install-swiftlint.sh). A floating `brew install swiftlint`
      # would make the CI result depend on the runner image's package index.
      - name: Install SwiftLint
        run: |
          ci_scripts/install-swiftlint.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods 1.17.0 (via Gemfile)
        run: bundle install

      - name: Resolve CocoaPods dependencies
        run: bundle exec pod install

      # Building needs no device at all, so the generic simulator platform is
      # enough. Only the Test step below resolves a concrete device.
      - name: Build
        run: |
          xcodebuild build \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/derived-data"

      # Resolve a simulator device at run time (ci_scripts/resolve-simulator.sh);
      # the script labels a missing runtime as an infrastructure failure, not a
      # code failure.
      - name: Resolve simulator for tests
        run: ci_scripts/resolve-simulator.sh

      - name: Test
        run: |
          xcodebuild test \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived-data"

      # Build the UITest bundle for the screenshots job (below) to reuse via
      # test-without-building. Only runs on UI-change PRs; the products are
      # uploaded as an artifact so the screenshots job skips recompiling.
      - name: Build for UI testing
        if: needs.changes.outputs.ui == 'true'
        run: |
          xcodebuild build-for-testing \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "generic/platform=iOS Simulator" \
            -only-testing:TurnipUITests \
            -derivedDataPath "$RUNNER_TEMP/derived-data"

      - name: Upload build products for screenshots
        if: needs.changes.outputs.ui == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-products
          path: ${{ runner.temp }}/derived-data/Build/Products
          retention-days: 1

  # Captures simulator screenshots for UI-change PRs (CONTRIBUTING.md asks for
  # screenshots on UI changes) so nobody needs a local simulator to produce them.
  # Reuses the build products from build-and-test via test-without-building —
  # it does NOT recompile the app.
  screenshots:
    needs: [changes, build-and-test]
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Bundler gems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: |
          ci_scripts/install-xcodegen.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods 1.17.0 (via Gemfile)
        run: bundle install

      - name: Resolve CocoaPods dependencies
        run: bundle exec pod install

      # The build products (app + UITest bundle) come from build-and-test;
      # this job never compiles.
      - name: Download build products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-products
          path: ${{ runner.temp }}/derived-data/Build/Products

      # The macos-26 fleet occasionally hands out a VM whose iOS simulator
      # runtime was never installed; xcodebuild then dies with "Unable to
      # find a device matching the provided destination specifier". Detect
      # that up front: create the device from an installed iOS runtime when
      # one exists, otherwise fail with a re-run hint instead of a cryptic
      # xcodebuild error.
      - name: Ensure iPhone 17 simulator exists
        run: |
          set -euo pipefail
          # Anchor the match to the exact "iPhone 17" device name: an
          # unanchored grep also matches "iPhone 17 Pro" lines, so a VM with
          # only the Pro would pass this preflight and then die in xcodebuild
          # with the cryptic "unable to find a device" error below.
          if xcrun simctl list devices available 2>/dev/null | grep -qE "^\s*iPhone 17 \("; then
            echo "iPhone 17 simulator is available."
            exit 0
          fi
          RUNTIME="$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin).get('runtimes', [])
          ios = [r for r in runtimes if 'iOS' in r.get('name', '') or r.get('platform') == 'iOS']
          ios.sort(key=lambda r: r.get('version', ''), reverse=True)
          print(ios[0]['identifier'] if ios else '')
          ")"
          if [[ -z "$RUNTIME" ]]; then
            echo "::error::No iOS simulator runtime installed on this runner VM - re-run the job to land on a healthy VM."
            exit 1
          fi
          DEVTYPE="$(xcrun simctl list devicetypes --json | python3 -c "
          import json, sys
          dts = json.load(sys.stdin).get('devicetypes', [])
          m = [d for d in dts if d.get('name') == 'iPhone 17']
          print(m[0]['identifier'] if m else '')
          ")"
          if [[ -z "$DEVTYPE" ]]; then
            echo "::error::No iPhone 17 device type in this Xcode - re-run or update the destination."
            exit 1
          fi
          xcrun simctl create "iPhone 17" "$DEVTYPE" "$RUNTIME"
          echo "Created iPhone 17 simulator from $RUNTIME."

      - name: Run screenshot UI tests (no rebuild)
        run: |
          xcodebuild test-without-building \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -only-testing:TurnipUITests \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -resultBundlePath screenshots.xcresult

      - name: Extract screenshot PNGs from xcresult
        id: extract
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          # Attachments live behind the action's testsRef, not in the
          # top-level bundle document (which is why a whole-document scan
          # finds zero PNGs): resolve the referenced test summary first,
          # then select the screenshot payloads from it.
          # `get`/`export` are deprecated in newer Xcode; --legacy restores the
          # previous interface (without it the step fails with exit code 64).
          TOP_JSON="$(xcrun xcresulttool get --legacy --format json --path screenshots.xcresult)"
          # Find all candidate testsRef IDs (there may be multiple actions);
          # prefer the one whose subtree actually contains attachments.
          # Note: macOS /bin/bash is 3.2 (no mapfile), so use a while-read loop.
          SUMMARY_JSON=""
          TESTS_REF=""
          CANDIDATE_COUNT=0
          while IFS= read -r cand; do
            [[ -n "$cand" ]] || continue
            CANDIDATE_COUNT=$((CANDIDATE_COUNT + 1))
            echo "Trying testsRef: $cand"
            cand_json="$(xcrun xcresulttool get --legacy --format json --path screenshots.xcresult --id "$cand" 2>/dev/null || true)"
            cand_count="$(echo "$cand_json" | jq '[.. | objects | select(has("payloadRef"))] | length' 2>/dev/null || echo 0)"
            echo "  -> $cand_count object(s) with payloadRef"
            if [[ "$cand_count" -gt 0 ]]; then
              TESTS_REF="$cand"
              SUMMARY_JSON="$cand_json"
              break
            fi
            # Keep the first as fallback for diagnostics
            if [[ -z "$SUMMARY_JSON" ]]; then
              TESTS_REF="$cand"
              SUMMARY_JSON="$cand_json"
            fi
          done < <(echo "$TOP_JSON" | jq -r '
            [.. | objects
             | select(has("testsRef") or has("testSummaryRef"))
             | (.testsRef // .testSummaryRef)
             | (.id._value // ._value // .)]
            | unique | .[]' 2>/dev/null || true)
          echo "Found $CANDIDATE_COUNT testsRef candidate(s)." 
          if [[ -z "$TESTS_REF" ]]; then
            echo "::error::No testsRef/testSummaryRef in the xcresult bundle. Top-level keys:"
            echo "$TOP_JSON" | jq -c 'keys' || true
            echo "$TOP_JSON" | jq -c '[.. | objects | select(has("actionResult")) | keys] | .[0:3]' || true
            exit 1
          fi
          echo "Using testsRef: $TESTS_REF"
          echo "Summary top-level keys: $(echo "$SUMMARY_JSON" | jq -c 'if type == "object" then keys else type end' 2>/dev/null || echo '?')"
          echo "Total objects with payloadRef: $(echo "$SUMMARY_JSON" | jq '[.. | objects | select(has("payloadRef"))] | length' 2>/dev/null || echo '?')"
          # Screenshot attachments are the only image payloads in the bundle
          # (this run executes TurnipUITests only). Search both the test summary
          # AND the top-level JSON (attachments can live at action level).
          for SEARCH_JSON in "$SUMMARY_JSON" "$TOP_JSON"; do
          echo "$SEARCH_JSON" | jq -r '
            [.. | objects
              | select(has("payloadRef"))
              | select(
                  ((.filename._value // .filename // "") | tostring | test("(?i)png|jpg|jpeg"))
                  or ((.name._value // .name // "") | tostring | test("(?i)png|screenshot|jpg|jpeg"))
                  or ((.uniformTypeIdentifier._value // .uniformTypeIdentifier // "") | tostring | test("(?i)png|jpeg")))
              | "\((.payloadRef.id._value // .payloadRef._value // ""))\t\((.name._value // .name // .filename._value // .filename // "screenshot"))"
            ] | unique | .[]'
          done |
          while IFS=$'\t' read -r ref raw_name; do
            [[ -n "$ref" ]] || continue
            safe="$(basename "$raw_name" | tr -c 'A-Za-z0-9._-' '_')"
            [[ "$safe" == *.png ]] || safe="$safe.png"
            dest="$OUT/$safe"
            n=2
            while [[ -e "$dest" ]]; do
              dest="$OUT/${safe%.png}-$n.png"
              n=$((n + 1))
            done
            xcrun xcresulttool export --legacy \
              --path screenshots.xcresult \
              --id "$ref" \
              --output-path "$dest" \
              --type file
          done
          count="$(find "$OUT" -name '*.png' | wc -l | tr -d ' ')"
          echo "Extracted $count screenshot(s):"
          ls -la "$OUT"
          if [[ "$count" -eq 0 ]]; then
            echo "No PNGs via xcresulttool JSON; falling back to direct bundle scan."
            echo "Attachment-like nodes (up to 12):"
            echo "$SUMMARY_JSON" | jq -c '[.. | objects | select(has("payloadRef") or has("attachment")) | {type: (._type._name // "?"), keys: keys, filename: (.filename._value // .filename // ""), name: (.name._value // .name // ""), uti: (.uniformTypeIdentifier._value // .uniformTypeIdentifier // "")}] | .[0:12]' || true
            # xcresult bundles store attachments as files under Data/; the JSON
            # summary doesn't always reference them (e.g. test-without-building).
            # Scan for PNGs directly by file signature.
            find screenshots.xcresult -type f | while IFS= read -r f; do
              if head -c 8 "$f" 2>/dev/null | od -An -tx1 | grep -q "89 50 4e 47 0d 0a 1a 0a"; then
                safe="screenshot-$(basename "$f" | tr -c 'A-Za-z0-9' '_').png"
                dest="$OUT/$safe"
                n=2
                while [[ -e "$dest" ]]; do
                  dest="$OUT/screenshot-$n.png"
                  n=$((n + 1))
                done
                cp "$f" "$dest"
                echo "Copied $f -> $dest"
              fi
            done
            count="$(find "$OUT" -name '*.png' | wc -l | tr -d ' ')"
            echo "After bundle scan: $count screenshot(s)."
          fi
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No screenshot PNGs found via xcresulttool or bundle scan."
            echo "All _type names present (up to 30):"
            echo "$SUMMARY_JSON" | jq -c '[.. | objects | ._type._name // empty] | unique | .[0:30]' || true
            exit 1
          fi
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-screenshots
          path: ${{ steps.extract.outputs.dir }}
          retention-days: 14
