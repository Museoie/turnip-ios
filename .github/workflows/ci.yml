name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR pushes — cancelling a push-to-main run can
  # leave a merged commit with a cancelled rather than green check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # scan-secrets.sh reads the commits this pull request adds on top of
          # its base, and a shallow clone does not contain the base commit.
          fetch-depth: 0

      # A credential pushed to a public repository is compromised whether or
      # not the commit survives, so this runs before the steps that take
      # minutes. It is also the only gate a fork contributor is subject to:
      # repository settings they cannot see are not a control on their diff.
      - name: Install gitleaks
        run: |
          ci_scripts/install-gitleaks.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A pull request checkout is refs/pull/N/merge, whose first parent is the
      # base tip that merge was computed against; the event payload's base.sha
      # is the tip at open time, so re-running after main moves would scan
      # main's own commits as if this branch had added them. Empty on a push to
      # main, which makes the scan read the working tree instead.
      - name: Scan for committed credentials
        run: ci_scripts/scan-secrets.sh "${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}"

      # Prose in CONTRIBUTING.md names every directory under Turnip/, and
      # nothing ties that sentence to the tree — adding a directory renames
      # nothing and breaks no build, so a stale list stays green. Runs before
      # the Xcode steps so drift costs seconds rather than a full build.
      - name: Check the documented directory list against the tree
        run: ci_scripts/check-directory-list.sh

      # A build that calls a required-reason API without declaring its category
      # in PrivacyInfo.xcprivacy is rejected at upload with ITMS-91053. Nothing
      # else here would catch it: CI never produces a distribution archive, so
      # the manifest is never submitted for validation and the first observation
      # would be the first TestFlight upload. Runs before the Xcode steps so the
      # answer costs seconds rather than a full build.
      - name: Check the privacy manifest against the required-reason APIs in use
        run: ci_scripts/check-privacy-manifest.sh

      # The gate above fails open on a typo: a misspelled pattern leaves the
      # API unmatched and still prints that every referenced category is
      # declared, so the build stays green on the violation it exists to stop.
      - name: Test the privacy-manifest check
        run: ci_scripts/test-check-privacy-manifest.sh

      # A gate that never fails is indistinguishable from no gate, so the scan
      # above is itself exercised against a planted credential.
      - name: Test the credential scan
        run: ci_scripts/test-scan-secrets.sh

      # check-repo-settings.sh runs on a weekly schedule against live
      # endpoints, so no pull request exercises it; this stubs the responses
      # a live repository cannot be made to produce on demand.
      - name: Test the repository-settings check
        run: ci_scripts/test-check-repo-settings.sh

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Bundler gems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      # The Build and Test steps below share $RUNNER_TEMP/derived-data, so
      # caching it makes small-diff pushes rebuild incrementally instead of
      # from scratch. The key pins the exact tree for re-runs; restore-keys
      # falls back to the newest cache and xcodebuild's own fingerprinting
      # rebuilds only what changed.
      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/derived-data
          key: derived-data-${{ runner.os }}-${{ hashFiles('Turnip/**/*.swift', 'TurnipUITests/**/*.swift', 'project.yml', 'Podfile.lock') }}
          restore-keys: |
            derived-data-${{ runner.os }}-

      # Matches the Xcode version CONTRIBUTING.md documents as the dev
      # baseline. XcodeGen's emitted project format tracks its own release,
      # not the selected Xcode, so this must stay new enough to open it —
      # see https://github.com/yonaskolb/XcodeGen/issues/1578. 26.3 is the
      # only version exercised here; README.md and CONTRIBUTING.md name it as
      # the verified one and mark the older minimum as untested.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # Homebrew only bottles the latest formula version, and its default
      # `pod` (via `brew install cocoapods`) drifts independently of
      # Xcode Cloud's ci_post_clone.sh, so both pipelines call the same
      # pinned installer instead. A user-writable prefix (no sudo) keeps
      # this identical to ci_post_clone.sh — Xcode Cloud's build
      # environment has no passwordless sudo.
      - name: Install XcodeGen
        run: |
          ci_scripts/install-xcodegen.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # SwiftLint is pinned the way XcodeGen is: a versioned release archive
      # into $HOME/.local with no sudo, verified by SHA-256 (see
      # ci_scripts/install-swiftlint.sh). A floating `brew install swiftlint`
      # would make the CI result depend on the runner image's package index.
      - name: Install SwiftLint
        run: |
          ci_scripts/install-swiftlint.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods 1.17.0 (via Gemfile)
        run: bundle install

      - name: Resolve CocoaPods dependencies
        run: bundle exec pod install

      # Building needs no device at all, so the generic simulator platform is
      # enough. Only the Test step below resolves a concrete device.
      - name: Build
        run: |
          xcodebuild build \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/derived-data"

      # Resolve a simulator device at run time (ci_scripts/resolve-simulator.sh);
      # the script labels a missing runtime as an infrastructure failure, not a
      # code failure.
      - name: Resolve simulator for tests
        run: ci_scripts/resolve-simulator.sh

      # Unit tests only: the UI test bundle (TurnipUITests) no longer runs in
      # CI — it stays in the scheme for local runs. The UI suite took ~15
      # minutes on its own; the unit suite is ~2, which is what keeps this
      # gate to minutes.
      - name: Test
        run: |
          xcodebuild test \
            -workspace Turnip.xcworkspace \
            -scheme Turnip \
            -destination "id=$SIMULATOR_UDID" \
            -only-testing:TurnipTests \
            -derivedDataPath "$RUNNER_TEMP/derived-data"

      # The app's own log never reaches the test output: the harnesses log how long each
      # sample-movie encode took or why it failed, and AVFoundation and VideoToolbox log
      # their errors there. Printed only when a test step failed. `xcodebuild test` shuts
      # the simulator down when it ends, and reading its log needs it booted; the log
      # itself survives the shutdown.
      - name: Simulator log
        if: failure() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b > /dev/null || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --style compact --last 2h --predicate '
            subsystem == "com.hoiekim.turnip"
            OR ((process == "Turnip" OR process CONTAINS[c] "VTEncoder" OR process CONTAINS[c] "VTDecoder"
                 OR process == "mediaserverd")
                AND (messageType == error OR messageType == fault))' || true
