name: Repo settings check

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  documented-settings:
    uses: ./.github/workflows/drift-tracker.yml
    with:
      checker-script: ci_scripts/check-repo-settings.sh
      tracker-title: Repository settings do not match the documents that promise them
      report-filename: settings-report.md
      # The report is posted before the close so the comment trail carries what
      # the run could read and what it could not: github.token is not a
      # repository administrator, so the two scanning settings are unread on
      # every scheduled run and the verdict being closed here covers the rest.
      post-report-on-close: true
      close-comment: Every setting this run could read matches the documents again. The report above names any it could not read; this run claims nothing about those.
