name: Dependency check

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  unwatched-pins:
    uses: ./.github/workflows/drift-tracker.yml
    with:
      checker-script: ci_scripts/check-unwatched-pins.sh
      tracker-title: Unwatched dependency pins have moved
      report-filename: pin-report.md
      close-comment: All four pins are current again.
